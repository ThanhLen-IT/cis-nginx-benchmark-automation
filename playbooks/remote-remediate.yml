---
- name: Remediate NGINX on explicitly selected SSH targets
  hosts: nginx_servers
  become: true
  gather_facts: true
  pre_tasks:
    - name: Require the remote CLI contract
      ansible.builtin.assert:
        that:
          - ansible_connection == 'ssh'
          - nginx_cis_execution_mode == 'remote'
          - cis_operation in ['remediate', 'idempotence']
          - cis_run_id is match('^[A-Za-z0-9][A-Za-z0-9_.-]{0,79}$')
  roles:
    - role: nginx_cis
