- name: buffer context review
  expected:
    5.2.3: REVIEW
  overrides:
    cis_nginx_t:
      stdout: "# configuration file /etc/nginx/nginx.conf:\nuser nginx;\npid /run/nginx.pid;\nerror_log /var/log/nginx/error.log\
        \ info;\nevents { worker_connections 1024; }\nhttp {\n server_tokens off;\n keepalive_timeout 10s;\n send_timeout\
        \ 10s;\n client_header_timeout 10s;\n client_body_timeout 10s;\n client_max_body_size 2M;\n large_client_header_buffers\
        \ 8 16k;\n add_header X-Content-Type-Options \"nosniff\" always;\n add_header Referrer-Policy \"strict-origin-when-cross-origin\"\
        \ always;\n log_format cis_json escape=json '{\"timestamp\":\"$time_iso8601\",\"remote_addr\":\"$remote_addr\",\"\
        remote_user\":\"$remote_user\",\"status\":$status,\"user_agent\":\"$http_user_agent\",\"request\":\"$request\"}';\n\
        \ access_log /var/log/nginx/access.json cis_json;\n ssl_protocols TLSv1.3;\n server { listen 80 default_server; server_name\
        \ _; return 444; }\n server { listen 443 ssl default_server; server_name _; ssl_reject_handshake on; }\n server {\
        \ listen 80; server_name cis.local; return 301 https://cis.local$request_uri; }\n server {\n  listen 443 ssl;\n  server_name\
        \ cis.local;\n  ssl_certificate /etc/nginx/ssl/cis-lab.crt;\n  ssl_certificate_key /etc/nginx/ssl/cis-lab.key;\n \
        \ error_page 404 /404.html;\n  location ~ /\\.(?!well-known(?:/|$)) { deny all; }\n  location / { try_files $uri $uri/\
        \ =404; }\n }\n}\n"
      rc: 0
      stderr: ''
