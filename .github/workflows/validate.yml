name: Ansible-native validation
on:
  push:
    branches: [main, feat/ansible-native]
  pull_request:
permissions:
  contents: read
jobs:
  native-regression:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.14'}
      - run: pip install -r requirements.txt
      - run: ansible-playbook site.yml --syntax-check
      - run: ansible-playbook -i inventory/hosts-aws.yml playbooks/remote.yml --syntax-check
      - run: ansible-playbook tests/native.yml
      - run: sudo apt-get update && sudo apt-get install -y nginx openssl curl iproute2
      - run: NGINX_TEST_BINARY=/usr/sbin/nginx ansible-playbook tests/live.yml
  ubuntu-local:
    strategy:
      fail-fast: false
      matrix: {os: [ubuntu-24.04, ubuntu-26.04]}
    runs-on: '${{ matrix.os }}'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.14'}
      - run: pip install -r requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y nginx curl openssl iproute2 sudo
      - name: Start and verify baseline before live audit
        run: |
          sudo systemctl enable --now nginx
          sudo nginx -t
          curl --noproxy '*' -fsSI http://127.0.0.1/
      - name: Full native audit remediation re-audit and actual idempotence
        run: ansible-playbook site.yml -e cis_run_id=ci-native-local -e cis_action=run -e cis_idempotence=true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 'native-local-${{ matrix.os }}'
          path: evidence/
