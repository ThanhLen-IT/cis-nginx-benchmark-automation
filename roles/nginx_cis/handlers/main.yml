- name: Validate installed NGINX configuration
  ansible.builtin.command: nginx -t
  changed_when: false
  listen: Apply validated nginx configuration
- name: Reload NGINX after successful validation
  ansible.builtin.systemd_service:
    name: nginx
    state: reloaded
  listen: Apply validated nginx configuration
- name: Record remediation change
  ansible.builtin.set_fact:
    cis_remediation_changed: true
