---
# Shared defaults for nginx_cis role (CIS NGINX Benchmark v3.0.0)

# --- Shared paths & service ---
nginx_user: nginx
nginx_conf_dir: /etc/nginx
nginx_main_conf: /etc/nginx/nginx.conf
nginx_conf_d_dir: /etc/nginx/conf.d
nginx_snippets_dir: /etc/nginx/snippets
nginx_log_dir: /var/log/nginx
nginx_web_root: /var/www/html

# --- Section 1 & 2 (TV1: feature/configuration) ---
# CIS 1.1.1: Minimum NGINX version
nginx_minimum_version: "1.28.0"

# CIS 1.2.1: Official NGINX stable repository
nginx_repository_url: "https://nginx.org/packages/ubuntu"
nginx_repository_distribution: "noble"
nginx_repository_component: "nginx"

# Official signing key
nginx_signing_key_url: "https://nginx.org/keys/nginx_signing.key"
nginx_signing_key_path: "/usr/share/keyrings/nginx-archive-keyring.gpg"

# Repository configuration
nginx_repository_file: "/etc/apt/sources.list.d/nginx.list"
nginx_apt_preferences_file: "/etc/apt/preferences.d/99nginx"

# Section 2 - Basic Configuration
nginx_keepalive_timeout: "10s"
nginx_send_timeout: "10s"

nginx_allowed_ports:
  - 80
  - 443

nginx_config_dir_mode: "0750"
nginx_config_file_mode: "0640"

nginx_pid_file: "/run/nginx.pid"
nginx_default_server_return_code: 444

# --- Section 3 & 4 (TV2: feature/logging-tls) ---
# Add logging & TLS defaults here

# --- Section 5 (TV3: feature/audit-headers) ---
# CIS 5.2.1: Timeout values for reading client header and body (10-20s recommended)
# Note: 10s also aligns with CIS 2.4.4 (send_timeout <= 10s, not 0)
nginx_client_header_timeout: "10s"
nginx_client_body_timeout: "10s"
nginx_send_timeout: "10s"

# CIS 5.2.2: Maximum request body size
nginx_client_max_body_size: "2M"

# CIS 5.2.3: Large client header buffers (v3.0.0 compliant baseline: 4 8k)
nginx_large_client_header_buffers: "4 8k"

# CIS 5.3.1 & 5.3.3: Browser security headers (must include 'always')
nginx_x_content_type_options: "nosniff"
nginx_referrer_policy: "strict-origin-when-cross-origin"
