---
# Dedicated Ubuntu 24.04 lab VM; the role owns the active nginx.conf.
nginx_cis_sections: [1, 2, 3, 4, 5]
nginx_cis_profile_path: /var/lib/nginx-cis/profile.json
nginx_cis_backup_dir: /var/backups/nginx-cis/direct-playbook
nginx_cis_server_names: [cis.local, localhost, 127.0.0.1]
nginx_cis_primary_name: cis.local
nginx_cis_private_ip: 127.0.0.1
nginx_cis_web_root: /var/www/cis-lab
nginx_cis_tls_certificate: /etc/nginx/ssl/cis-lab.crt
nginx_cis_tls_private_key: /etc/nginx/ssl/cis-lab.key
nginx_cis_tls_certificate_days: 365
nginx_cis_minimum_version: "1.28.0"
nginx_cis_signing_fingerprint: 573BFD6B3D8FBC641079A6ABABF5BD827BD9BF62
nginx_cis_keepalive_timeout: 10s
nginx_cis_send_timeout: 10s
nginx_cis_client_header_timeout: 10s
nginx_cis_client_body_timeout: 10s
nginx_cis_client_max_body_size: 2M
nginx_cis_large_client_header_buffers: 4 8k
nginx_cis_referrer_policy: strict-origin-when-cross-origin
