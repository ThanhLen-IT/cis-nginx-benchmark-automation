---
# CIS NGINX Benchmark v3.0.0
# Section 2 - Basic Configuration

# ---------------------------------------------------------
# CIS 2.2.1 - Non-privileged dedicated service account
# CIS 2.2.2 - Service account is locked
# CIS 2.2.3 - Service account has invalid shell
# ---------------------------------------------------------
- name: "CIS 2.2 | Ensure nginx service account exists"
  ansible.builtin.user:
    name: "{{ nginx_user }}"
    system: true
    shell: /usr/sbin/nologin
    password_lock: true
    group: nginx
    groups: nginx
    append: false
    state: present

- name: "CIS 2.2.1 | Get nginx service account UID"
  ansible.builtin.command:
    argv:
      - id
      - -u
      - "{{ nginx_user }}"
  register: nginx_uid
  changed_when: false

- name: "CIS 2.2.1 | Get nginx service account groups"
  ansible.builtin.command:
    argv:
      - id
      - -Gn
      - "{{ nginx_user }}"
  register: nginx_groups
  changed_when: false

- name: "CIS 2.2.1 | Check nginx sudo privileges"
  ansible.builtin.command:
    argv:
      - sudo
      - -n
      - -l
      - -U
      - "{{ nginx_user }}"
  register: nginx_sudo_check
  changed_when: false
  failed_when: false

- name: "CIS 2.2.1 | Verify service account is non-privileged"
  ansible.builtin.assert:
    that:
      - nginx_uid.stdout | int != 0
      - nginx_groups.stdout.split() | intersect(['root', 'wheel', 'sudo', 'admin', 'adm']) | length == 0
      - "'not allowed to run sudo' in nginx_sudo_check.stdout | lower"
    fail_msg: "NGINX service account does not meet CIS 2.2.1"
    success_msg: "NGINX service account meets CIS 2.2.1"

- name: "CIS 2.2.2 | Verify nginx account is locked"
  ansible.builtin.command:
    argv:
      - passwd
      - -S
      - "{{ nginx_user }}"
  register: nginx_password_status
  changed_when: false

- name: "CIS 2.2.2 | Assert nginx account is locked"
  ansible.builtin.assert:
    that:
      - nginx_password_status.stdout.split()[1] in ['L', 'LK']
    fail_msg: "NGINX service account password is not locked"
    success_msg: "NGINX service account is locked"

- name: "CIS 2.2.3 | Verify nginx account shell"
  ansible.builtin.command:
    argv:
      - getent
      - passwd
      - "{{ nginx_user }}"
  register: nginx_passwd_entry
  changed_when: false

- name: "CIS 2.2.3 | Assert nginx account cannot login interactively"
  ansible.builtin.assert:
    that:
      - nginx_passwd_entry.stdout.split(':')[-1] in ['/usr/sbin/nologin', '/sbin/nologin', '/bin/nologin', '/bin/false']
    fail_msg: "NGINX service account has an interactive shell"
    success_msg: "NGINX service account shell meets CIS 2.2.3"

# ---------------------------------------------------------
# CIS 2.3.1 - NGINX configuration ownership
# ---------------------------------------------------------
- name: "CIS 2.3.1 | Ensure NGINX configuration directory and contents are owned by root"
  ansible.builtin.file:
    path: /etc/nginx
    owner: root
    group: root
    recurse: true
    state: directory

# ---------------------------------------------------------
# CIS 2.3.2 - Restrict NGINX configuration permissions
# ---------------------------------------------------------
- name: "CIS 2.3.2 | Set NGINX configuration root directory permissions"
  ansible.builtin.file:
    path: /etc/nginx
    owner: root
    group: root
    mode: "0750"
    state: directory

- name: "CIS 2.3.2 | Find NGINX configuration directories"
  ansible.builtin.find:
    paths: /etc/nginx
    recurse: true
    file_type: directory
  register: nginx_config_directories

- name: "CIS 2.3.2 | Restrict NGINX configuration directory permissions"
  ansible.builtin.file:
    path: "{{ item.path }}"
    owner: root
    group: root
    mode: "0750"
    state: directory
  loop: "{{ nginx_config_directories.files }}"

- name: "CIS 2.3.2 | Find NGINX configuration files"
  ansible.builtin.find:
    paths: /etc/nginx
    recurse: true
    file_type: file
  register: nginx_config_files

- name: "CIS 2.3.2 | Restrict NGINX configuration file permissions"
  ansible.builtin.file:
    path: "{{ item.path }}"
    owner: root
    group: root
    mode: "0640"
    state: file
  loop: "{{ nginx_config_files.files }}"

- name: "CIS 2.3.2 | Restrict NGINX modules directory permissions"
  ansible.builtin.file:
    path: "{{ nginx_modules_directory }}"
    owner: root
    group: root
    mode: "0750"
    state: directory

# ---------------------------------------------------------
# CIS 2.3.3 - Secure NGINX PID file
# ---------------------------------------------------------
- name: "CIS 2.3.3 | Secure NGINX PID file ownership and permissions"
  ansible.builtin.file:
    path: "{{ nginx_pid_file }}"
    owner: root
    group: root
    mode: "0644"
    state: file

# ---------------------------------------------------------
# CIS 2.4.1 - Restrict NGINX listening ports
# ---------------------------------------------------------
- name: "CIS 2.4.1 | Get active NGINX listen directives"
  ansible.builtin.shell: nginx -T 2>&1
  register: nginx_active_config
  changed_when: false

- name: "CIS 2.4.1 | Extract configured listening ports"
  ansible.builtin.set_fact:
    nginx_configured_ports: >-
      {{
        nginx_active_config.stdout
        | regex_findall('(?m)^ *listen +(?:[^; ]+:)?([0-9]+)')
        | map('int')
        | unique
        | list
      }}

- name: "CIS 2.4.1 | Ensure NGINX listens only on approved ports"
  ansible.builtin.assert:
    that:
      - nginx_configured_ports | length > 0
      - nginx_configured_ports | difference(nginx_allowed_ports) | length == 0
    fail_msg: "NGINX listens on an unapproved port: {{ nginx_configured_ports }}"
    success_msg: "NGINX listens only on approved ports: {{ nginx_configured_ports }}"

# ---------------------------------------------------------
# CIS 2.4.2 - Default server
# CIS 2.4.3 - Keepalive timeout
# CIS 2.4.4 - Send timeout
# ---------------------------------------------------------
- name: "CIS 2.4.2 | Deploy default server configuration"
  ansible.builtin.template:
    src: cis-default-server.conf.j2
    dest: /etc/nginx/conf.d/00-cis-default-server.conf
    owner: root
    group: root
    mode: "0640"

- name: "CIS 2.4.3-2.4.4 | Deploy connection timeout configuration"
  ansible.builtin.template:
    src: cis-connection-timeouts.conf.j2
    dest: /etc/nginx/conf.d/01-cis-connection-timeouts.conf
    owner: root
    group: root
    mode: "0640"

# ---------------------------------------------------------
# CIS 2.5 - Limit NGINX Information Disclosure
# ---------------------------------------------------------
- name: "CIS 2.5.1 | Deploy server token configuration"
  ansible.builtin.template:
    src: cis-information-disclosure.conf.j2
    dest: /etc/nginx/conf.d/02-cis-information-disclosure.conf
    owner: root
    group: root
    mode: "0640"

- name: "CIS 2.5.2 | Deploy neutral index page"
  ansible.builtin.template:
    src: cis-index.html.j2
    dest: /usr/share/nginx/html/index.html
    owner: root
    group: root
    mode: "0644"

- name: "CIS 2.5.2 | Deploy neutral error page"
  ansible.builtin.template:
    src: cis-50x.html.j2
    dest: /usr/share/nginx/html/50x.html
    owner: root
    group: root
    mode: "0644"

- name: "CIS 2.5.3 | Ensure NGINX snippets directory exists"
  ansible.builtin.file:
    path: "{{ nginx_snippets_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: "CIS 2.5.3 | Deploy hidden file restriction snippet"
  ansible.builtin.template:
    src: cis-deny-hidden.conf.j2
    dest: /etc/nginx/snippets/cis-deny-hidden.conf
    owner: root
    group: root
    mode: "0640"

- name: "CIS 2.5.3 | Deploy hardened website server"
  ansible.builtin.template:
    src: cis-website-server.conf.j2
    dest: /etc/nginx/conf.d/default.conf
    owner: root
    group: root
    mode: "0640"