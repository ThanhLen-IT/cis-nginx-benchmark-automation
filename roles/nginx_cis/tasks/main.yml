---
- name: Preflight and load cumulative lab profile
  ansible.builtin.import_tasks: preflight.yml
- name: Section 1 installation
  ansible.builtin.import_tasks: section_1_installation.yml
  when: 1 in nginx_cis_sections
- name: Check NGINX prerequisite for selected sections
  ansible.builtin.command: nginx -v
  changed_when: false
- name: Section 2 configuration
  ansible.builtin.import_tasks: section_2_configuration.yml
  when: 2 in nginx_cis_enabled
- name: Section 3 logging
  ansible.builtin.import_tasks: section_3_logging.yml
  when: 3 in nginx_cis_enabled
- name: Section 4 TLS material
  ansible.builtin.import_tasks: section_4_tls.yml
  when: 4 in nginx_cis_enabled
- name: Section 5 request policy
  ansible.builtin.import_tasks: section_5_request_controls.yml
  when: 5 in nginx_cis_enabled
- name: Compile and apply shared configuration
  ansible.builtin.import_tasks: deploy_site.yml
