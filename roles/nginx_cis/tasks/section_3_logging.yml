---
- name: CIS 3 prepare log directory
  ansible.builtin.file:
    path: /var/log/nginx
    state: directory
    owner: root
    group: adm
    mode: "0750"
- name: CIS 3 protect log files without touching timestamps
  ansible.builtin.file:
    path: "{{ item }}"
    state: touch
    owner: root
    group: adm
    mode: "0640"
    access_time: preserve
    modification_time: preserve
  loop: [/var/log/nginx/access.json, /var/log/nginx/error.log]
- name: Rotate JSON access log
  ansible.builtin.copy:
    dest: /etc/logrotate.d/nginx-cis
    owner: root
    group: root
    mode: "0644"
    content: |
      /var/log/nginx/access.json {
          daily
          rotate 7
          missingok
          notifempty
          compress
          delaycompress
          create 0640 root adm
          sharedscripts
          postrotate
              [ ! -f /run/nginx.pid ] || kill -USR1 $(cat /run/nginx.pid)
          endscript
      }
