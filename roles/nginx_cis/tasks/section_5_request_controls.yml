---
- name: Validate documented request policy
  ansible.builtin.assert:
    that:
      - nginx_cis_client_header_timeout == '10s'
      - nginx_cis_client_body_timeout == '10s'
      - nginx_cis_send_timeout == '10s'
      - nginx_cis_client_max_body_size == '2M'
      - nginx_cis_large_client_header_buffers == '4 8k'
      - nginx_cis_referrer_policy in ['no-referrer', 'same-origin', 'strict-origin', 'strict-origin-when-cross-origin']
    fail_msg: "Changing lab policy requires updating the audit conditions too."
